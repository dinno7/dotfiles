gui:
  nerdFontsVersion: "3"
  theme:
    activeBorderColor:
      - "#ff9e64"
      - "bold"
    inactiveBorderColor:
      - "#27a1b9"
    searchingActiveBorderColor:
      - "#ff9e64"
      - "bold"
    optionsTextColor:
      - "#7aa2f7"
    selectedLineBgColor:
      - "#283457"
    cherryPickedCommitFgColor:
      - "#7aa2f7"
    cherryPickedCommitBgColor:
      - "#bb9af7"
    markedBaseCommitFgColor:
      - "#7aa2f7"
    markedBaseCommitBgColor:
      - "#e0af68"
    unstagedChangesColor:
      - "#db4b4b"
    defaultFgColor:
      - "#c0caf5"
os:
  # A built-in preset that sets all of the above settings. Supported presets
  # are defined in the getPreset function in editor_presets.go.
  editPreset: "nvim"
git:
  diffRenderers:
    - colorArg: always
      command: delta --dark --paging=never --syntax-theme base17-256 --diff-so-fancy -s

customCommands:
  - key: "<c-c>"
    description: "AI-powered conventional commit"
    context: "global"
    loadingText: "Generating commit messages..."
    prompts:
      - type: "menu"
        key: "Type"
        title: "Type of change"
        options:
          - name: "feat"
            description: "A new feature"
            value: "feat"
          - name: "fix"
            description: "A bug fix"
            value: "fix"
          - name: "chore"
            description: "Maintenance / tooling / non-user-facing"
            value: "chore"
          - name: "docs"
            description: "Documentation only"
            value: "docs"
          - name: "style"
            description: "Formatting / linting / no behavior change"
            value: "style"
          - name: "refactor"
            description: "Refactor without behavior change"
            value: "refactor"
          - name: "perf"
            description: "Performance improvement"
            value: "perf"
          - name: "test"
            description: "Add or update tests"
            value: "test"
      - type: "menuFromCommand"
        title: "AI Generated Commit Messages"
        key: "CommitFile"
        command: "lgaicm suggest --type {{.Form.Type}}"
        filter: "^(?P.*?) <===> (?P.*)$"
        valueFormat: "{{.file}}"
        labelFormat: "{{.label}}"
    command: "lgaicm commit --file {{.Form.CommitFile | quote}}"
