[accessibility]
ui_scale = 0.85000000521540642

[bar.default]
background_opacity = 0.39999999105930328
capsule = true
capsule_group = []
capsule_opacity = 0.79999998211860657
capsule_padding = 4.0
capsule_radius = 3
center = [ "date", "clock" ]
end = [
    "tray",
    "keyboard_layout",
    "notifications",
    "wallpaper",
    "clipboard",
    "bluetooth",
    "network",
    "volume",
    "brightness",
    "battery",
    "caffeine",
    "control-center",
    "session"
]
font_family = "JetBrainsMonoNL Nerd Font Propo"
icon_color = "primary"
margin_ends = 0
padding = 16
radius = 0
scale = 0.90000000596046448
shadow = false
start = [ "launcher", "workspaces", "ram", "temp", "cpu" ]
thickness = 25
widget_spacing = 5

[battery]
warning_threshold = 20

[control_center]
width = 800

    [[control_center.shortcuts]]
    type = "wifi"

    [[control_center.shortcuts]]
    type = "mic_mute"

    [[control_center.shortcuts]]
    type = "bluetooth"

    [[control_center.shortcuts]]
    type = "audio"

    [[control_center.shortcuts]]
    type = "caffeine"

    [[control_center.shortcuts]]
    type = "session"

[desktop_widgets]
schema_version = 2
widget_order = [ "desktop-widget-0000000000000006", "desktop-widget-0000000000000007", "desktop-widget-0000000000000008" ]

    [desktop_widgets.grid]
    cell_size = 8
    major_interval = 4
    visible = true

    [desktop_widgets.widget.desktop-widget-0000000000000006]
    box_height = 120.0
    box_width = 208.0
    cx = 691.0
    cy = 100.0
    output = "eDP-1"
    placement_height = 768.0
    placement_width = 1366.0
    rotation = 0.0
    type = "sysmon"

        [desktop_widgets.widget.desktop-widget-0000000000000006.settings]
        background = false
        color2 = "hover"
        display = "graph"
        gauge_layout = "horizontal"
        shadow = false
        show_label = true
        stat = "cpu_usage"
        stat2 = "cpu_temp"

    [desktop_widgets.widget.desktop-widget-0000000000000007]
    box_height = 0.0
    box_width = 0.0
    cx = 683.0
    cy = 384.0
    output = "eDP-1"
    placement_height = 768.0
    placement_width = 1366.0
    rotation = 0.0
    type = "fancy_audio_visualizer"

        [desktop_widgets.widget.desktop-widget-0000000000000007.settings]
        background = false

    [desktop_widgets.widget.desktop-widget-0000000000000008]
    box_height = 32.0
    box_width = 32.0
    cx = 16.0
    cy = 752.0
    output = "eDP-1"
    placement_height = 768.0
    placement_width = 1366.0
    rotation = 0.0
    type = "button"

        [desktop_widgets.widget.desktop-widget-0000000000000008.settings]
        background = true
        command = "alacritty"
        glyph = "terminal"
        hover_background = "hover"
        variant = "ghost"

[dock]
auto_hide = true
background_opacity = 0.44999998994171619
cross_axis_padding = 0
enabled = true
icon_size = 34
inactive_opacity = 0.68999998457729816
item_spacing = 0
layer = "overlay"
main_axis_padding = 10
margin_edge = 10
radius = 0
radius_bottom_left = 7
radius_bottom_right = 7
radius_top_right = 7
reserve_space = false

[keybinds]
down = [ "Down", "Ctrl+j" ]
up = [ "Up", "Ctrl+k" ]

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 683.0
    cy = 586.0
    output = "eDP-1"
    placement_height = 768.0
    placement_width = 1366.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[nightlight]
enabled = true
temperature_night = 4600

[osd]
background_opacity = 0.67999998480081558

[shell]
clipboard_auto_paste = "ctrl_v"
clipboard_history_max_entries = 500
corner_radius_scale = 0.40000000596046448
font_family = "JetBrainsMono Nerd Font Propo"
settings_window_translucent = true

    [shell.animation]
    speed = 0.95000001415610313

    [shell.keyboard_layout.custom_labels]
    "English (US)" = "En"
    Persian = "Fa"

    [shell.launcher]
    auto_paste = "off"
    categories = false
    show_app_actions = true

    [shell.panel]
    control_center_placement = "floating"
    transparency_mode = "glass"

[theme]
builtin = "Tokyo-Night"
mode = "dark"
pure_black_dark = true
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "gtk3", "gtk4", "kcolorscheme", "qt" ]
    community_ids = [ "claude-code", "spicetify", "telegram", "obsidian", "fastfetch" ]

[wallpaper]
directory = "/home/dinno/Pictures"

    [wallpaper.default]
    path = "/home/dinno/Pictures/humanbot.png"

    [wallpaper.last]
    path = "/home/dinno/Pictures/humanbot.png"

    [wallpaper.monitors.eDP-1]
    path = "/home/dinno/Pictures/humanbot.png"

[weather]
enabled = false

[widget.clock]
format = "{:%H:%M:%S}"
timezone = "Asia/Tehran"

[widget.date]
format = "{:%Y-%m-%d}"
timezone = "Asia/Tehran"

[widget.keyboard_layout]
capsule_radius = "auto"

[widget.media]
enabled = true

[widget.workspaces]
occupied_color = "outline"
