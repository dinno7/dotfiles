[accessibility]
ui_scale = 0.85000000521540642

[bar.default]
background_opacity = 0.4999999888241291
capsule = true
capsule_group = []
capsule_opacity = 0.0
capsule_padding = 2.0
capsule_radius = 3
capsule_thickness = 0.74999998696148396
center = [ "date", "clock" ]
end = [
    "tray",
    "status",
    "keyboard_layout",
    "notifications",
    "wallpaper",
    "clipboard",
    "bluetooth",
    "network",
    "volume",
    "brightness",
    "battery",
    "caffeine",
    "control-center",
    "session"
]
font_family = "JetBrainsMonoNL Nerd Font Propo"
font_weight = 400
margin_edge = 1
margin_ends = 1
radius = 0
scale = 1.0000000074505806
shadow = false
start = [ "launcher", "workspaces", "ram", "temp", "cpu" ]
thickness = 24
widget_spacing = 4

[battery]
warning_threshold = 20

[control_center]
width = 800

    [[control_center.shortcuts]]
    type = "wifi"

    [[control_center.shortcuts]]
    type = "mic_mute"

    [[control_center.shortcuts]]
    type = "bluetooth"

    [[control_center.shortcuts]]
    type = "audio"

    [[control_center.shortcuts]]
    type = "caffeine"

    [[control_center.shortcuts]]
    type = "session"

[desktop_widgets]
schema_version = 2
widget_order = [ "desktop-widget-0000000000000008" ]

    [desktop_widgets.grid]
    cell_size = 8
    major_interval = 4
    visible = true

    [desktop_widgets.widget.desktop-widget-0000000000000008]
    box_height = 32.0
    box_width = 32.0
    cx = 1350.0
    cy = 752.0
    output = "eDP-1"
    placement_height = 768.0
    placement_width = 1366.0
    rotation = 0.0
    type = "button"

        [desktop_widgets.widget.desktop-widget-0000000000000008.settings]
        background = true
        command = "alacritty"
        glyph = "terminal"
        hover_background = "hover"
        variant = "ghost"

[dock]
auto_hide = true
cross_axis_padding = 0
enabled = true
icon_size = 34
inactive_opacity = 0.68999998457729816
item_spacing = 0
layer = "overlay"
main_axis_padding = 10
margin_edge = 10
radius = 0
radius_bottom_left = 7
radius_bottom_right = 7
radius_top_right = 7
reserve_space = false

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = false
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = false
    timeout = 660.0

[keybinds]
down = [ "Down", "Ctrl+j" ]
up = [ "Up", "Ctrl+k" ]

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 683.0
    cy = 586.0
    output = "eDP-1"
    placement_height = 768.0
    placement_width = 1366.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[nightlight]
enabled = true
temperature_night = 4600

[plugin_settings."davemhammer/obsidian"]
daily_folder = "daily"
git_commit_message = ""
vault_name = "dinno"
vault_path = "/home/dinno/Documents/obsidian/mine"

[plugin_settings."noctalia/translator"]
target_lang = "fa"

[plugins]
enabled = [ "noctalia/translator", "davemhammer/obsidian" ]

[shell]
clipboard_auto_paste = "ctrl_v"
clipboard_history_max_entries = 500
corner_radius_scale = 0.40000000596046448
font_family = "JetBrainsMono Nerd Font Propo"
settings_window_translucent = true

    [shell.animation]
    speed = 0.95000001415610313

    [shell.keyboard_layout.custom_labels]
    "English (US)" = "En"
    Persian = "Fa"

    [shell.launcher]
    auto_paste = "off"
    categories = false
    show_app_actions = true

    [shell.panel]
    control_center_placement = "floating"
    transparency_mode = "glass"

[theme]
builtin = "Tokyo-Night"
mode = "dark"
pure_black_dark = true
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "gtk3", "gtk4", "kcolorscheme", "qt" ]
    community_ids = [ "claude-code", "spicetify", "telegram", "obsidian", "fastfetch" ]

[wallpaper]
directory = "/home/dinno/Pictures"

    [wallpaper.default]
    path = "/home/dinno/Pictures/Dinnowalls/wp4462135-alan-turing-wallpapers.png"

    [wallpaper.last]
    path = "/home/dinno/Pictures/Dinnowalls/wp4462135-alan-turing-wallpapers.png"

    [wallpaper.monitors.eDP-1]
    path = "/home/dinno/Pictures/Dinnowalls/wp4462135-alan-turing-wallpapers.png"

[weather]
enabled = false

[widget.clock]
format = "{:%H:%M:%S}"
timezone = "Asia/Tehran"

[widget.date]
format = "{:%Y-%m-%d}"
timezone = "Asia/Tehran"

[widget.keyboard_layout]
capsule_radius = "auto"

[widget.media]
enabled = true

[widget.status]
type = "davemhammer/obsidian:status"

[widget.workspaces]
occupied_color = "outline"
